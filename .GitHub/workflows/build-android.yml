name: Build XPLAYER Android APK

on:
workflow_dispatch:
push:
paths:
- 'XPLAYER-Android-Ready.zip'
- '.github/workflows/build-android.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Extract XPLAYER project
    run: |
      unzip -o XPLAYER-Android-Ready.zip -d project
      cd project
      npm install
      npm run build

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build Android APK
    run: |
      cd project
      npm install @capacitor/android
      npx cap add android || true
      npx cap sync android
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: XPLAYER-debug-APK
      path: project/android/app/build/outputs/apk/debug/app-debug.apk
