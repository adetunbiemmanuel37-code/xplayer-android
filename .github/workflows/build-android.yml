name: Build XPLAYER Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'XPLAYER-Android-Ready.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract XPLAYER project
        run: |
          unzip -o XPLAYER-Android-Ready.zip -d project
          cd project/xplayer-capacitor
          npm install --legacy-peer-deps
          npm run build

      - name: Build Android APK
        run: |
          cd project/xplayer-capacitor
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPLAYER-debug-APK
          path: project/xplayer-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
